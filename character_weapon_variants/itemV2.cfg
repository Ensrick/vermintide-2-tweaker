title = "Character Weapon Variants v0.1.513-dev";
description = "[b]Character Weapon Variants v0.1.513-dev[/b]\n\nRegisters new craftable weapon definitions grafted from cross-character models into lore-friendly, thematically appropriate packages. CWV supplies one 5-power Blacksmith copy of each weapon; craft additional owned instances through Crafting in Modded. Includes the Old Musket (toggle melee/ranged stance), Tuskgor Javelin, Sigmarite Greathammer, Longsword+Shield, Axe+Shield, and more.\n\n[b]Features[/b]\n- 20+ new cross-character weapon variants with unique models\n- Old Musket: melee/ranged stance toggle via special key\n- Custom illusion/skin pickers for cosmetic variants\n- Per-weapon animation tuning + 3P transform overrides\n- Automatic animation event translation for cross-character weapons\n- Balanced stat profiles matching or enhancing vanilla baselines\n- Full integration with cosmetics mods (MoreItemsLibrary + Material-Hijack)\n\n[h1]Credits[/h1]\n[b]\"Old Musket\" 3D model[/b] by [url=https://sketchfab.com/Lathander]Lathander[/url] on Sketchfab. Licensed [url=https://creativecommons.org/licenses/by/4.0/]CC-BY 4.0[/url]. [url=https://sketchfab.com/3d-models/old-musket-48f60e8cc54f4e64961f2e3ebcac5432]Source[/url]. Geometry converted from Collada to FBX, materials renamed for engine binding, textures converted to PNG; no artistic changes.\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (find it via /<mod>_regression_test or in the console log: search for the `enabled v` line)\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
