title = "Tweaker: Buffs v0.1.1-alpha";
description = "[b]Tweaker: Buffs v0.1.1-alpha[/b]\n\nShared Big Rebalance registry consumed by other Tweaker mods (Weapons, Careers, Enemies). Hosts the canonical 328-entry registration list (272 BuffTemplates, 37 damage profiles, 16 explosion templates, 3 stat buff methods) in deterministic sorted order. When the master toggle is on, registrations are injected once on every peer, eliminating cross-peer NetworkLookup divergence. Requires VMF.\n\n[b]Features[/b]\n- Single master toggle for Big Rebalance feature registration\n- Canonical 328-entry buff / damage profile / explosion template registry\n- Deterministic peer-aligned alphabetical ordering — identical registration on all peers\n- Public API for consumer mods: is_br_active() check before applying BR sub-features\n- Idempotent registration: safe across hot-reload and multiple invocations\n- Independent installation: install bt + one consumer mod for standalone BR features\n\n[b]Why it exists[/b]: the Tweaker: Weapons / Careers / Enemies mods each ship Big Rebalance-flavored toggles that overlay content into named buffs and damage profiles. Without this mod those names don't exist in the vanilla tables and the toggles silently no-op. Installing this mod and turning the master on lets all three behave as designed.\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (printed at the top of the in-game chat when you load into the keep)\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
