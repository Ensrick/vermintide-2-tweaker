title = "Verminious Dreams Lighting v1.0.6";
description = "Per-mission lighting overhaul for the three Verminious Dreams DLC missions whose vanilla atmosphere reads as too dark, muddy, or desaturated. Each mission ships with a hand-tuned profile applied automatically on level load; the global mod toggle and per-mission VMF toggles let you opt any of them back to vanilla.\n\n[b]Missions[/b]\n• The Forsaken Temple\n• Devious Delvings\n• The Well of Dreams\n\n[b]What changes[/b]\n• Per-mission ShadingEnvironment overrides: skydome tint, sun colour, secondary sun, ambient (low / top), fog, exposure.\n• Per-light Light component overrides (colour + intensity) on level-static lights — global plus per-group (torches / general).\n• All values shipped as defaults — install and play. No commands required to get the tuned look.\n\n[b]Live tuning[/b]\n• Console commands (prefix [b]vdl_[/b]) let you adjust any value in real time during a mission.\n• Type [b]/vdl_help[/b] in chat for the full list. [b]/vdl_sun[/b] (no args) prints the current vanilla and override values; [b]/vdl_sun 200 180 160[/b] sets the channel to an absolute byte-RGB triple. [b]/vdl_dump[/b] prints a copy-pasteable profile block.\n• Values are 0–255 byte RGB (like web / hex colours). Exposure and light intensity are scalars.\n\n[b]Multiplayer[/b]\n• Client-side only. No host requirement, no version-sync risk, no compatibility constraints.\n• Each player sees their own lighting — vanilla clients run vanilla, you run your tuned values.\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (find it via /<mod>_regression_test or in the console log: search for the `enabled v` line)\n\nRequires [b]VMF (Vermintide Mod Framework)[/b].\n\n[b]Source code:[/b] [url=https://github.com/Ensrick/vermintide-2-tweaker/tree/master/verminious_dreams_lighting]github.com/Ensrick/vermintide-2-tweaker[/url]\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
