title = "Tweaker: Lobby v0.1.2-dev";
description = "[b]Tweaker: Lobby v0.1.2-dev[/b]\n\nHost-side lobby controls and modded-realm mod-list notifications for Vermintide 2. Part of the Tweaker mod series. Requires VMF.\n\n[b]Features[/b]\n- Slot Reservations: persist steam_id → slot map; auto-kick non-reserved peers\n- Session Ignore List: two-tier (in-mission + persistent); auto-kick on join\n- Kick on Idle: position-delta polling with 60s warning before kick; whitelist support\n- Message of the Day: chunked VMF RPC delivery (respects 500-char limit); cross-peer\n- Modded-realm failed-join reveal: when a joiner lacks required mods, popup lists missing client_required mods + version mismatches instead of generic error\n- Modded manifest broadcast: host pre-publishes per-mod list to Steam lobby_data (60s heartbeat)\n- Workshop button: failed-join popup includes \"Open Workshop\" link to first missing mod\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (printed at the top of the in-game chat when you load into the keep)\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
