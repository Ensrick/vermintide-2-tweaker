title = "Tweaker: Cosmetics v0.9.148-dev";
description = "[b]Tweaker: Cosmetics v0.9.148-dev[/b]\n\nUnlocks hat/outfit cosmetics, enables cross-character weapon appearance swaps, adds custom weapon skins, and injects dynamic custom-glow cosmetic overlays for shields. Embeds Material-Hijack (patched), LA Prefix Patch, and MoreItemsLibrary for standalone operation.\n\n[b]Features[/b]\n- Unlock any hat or outfit across all characters\n- Cross-character weapon appearance swaps + custom illusions\n- Loremaster's Armoury integration (custom mesh swaps + per-variant icons)\n- Custom glow overlays on shields via in-game picker (rune family + magic family RGB sliders)\n- Per-weapon scale and grip-offset overrides\n- Embedded defensive forks of Material-Hijack + LA Prefix Patch + MoreItemsLibrary\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (find it via /<mod>_regression_test or in the console log: search for the `enabled v` line)\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
