title = "Tweaker: General v0.2.245-dev";
description = "Quality-of-life and host-side utility tweaks for Vermintide 2 — noclip, godmode, a full bot-improvement suite, creature/item spawners, level control, friendly-fire off, duplicate careers, host-side lobby controls (slot reservations, session ignore, kick-on-idle, MOTD, modded-realm failed-join mod-list reveal — absorbed from the retired Tweaker: Lobby), plus a set of dev/inspection commands. Part of the Tweaker mod series. Requires VMF.\n\n[b]Noclip[/b]\n• Fly through walls. WASD moves in the look direction, Space/Ctrl for up/down, hold Left Shift for a speed boost.\n• Configurable base speed (default 15 m/s) and boost multiplier (default 3×).\n• Chat command [b]/noclip[/b]. Toggle off mid-air and you'll fall to the ground.\n\n[b]Gameplay toggles[/b]\n• [b]Godmode[/b] — full invincibility for the local player: no damage taken, immune to disablers (pounce, packmaster hook, chaos-spawn / corruptor / tentacle grabs, hanging cage), AND invisible to enemy AI. Your 3P body fades as a visual cue; first-person view stays normal. Chat: [b]/god[/b].\n• [b]Allow Duplicate Careers[/b] — multiple players can pick the same hero/career in a lobby.\n• [b]Disable Friendly Fire[/b] — suppress FF damage from ranged AND melee sources. Champion+ difficulties normally enable ranged FF; this turns it off.\n• [b]Disable Enemy Spawns[/b] — block every enemy from spawning: hordes, specials, bosses, patrols, and pre-placed level enemies. Chat: [b]/no_enemies[/b]. Pair with [b]/clear_enemies[/b] (Clear Enemy Spawns) to despawn the ones already alive.\n\n[b]Bots[/b]\n• [b]Bot Behavior Improvements[/b] and [b]Improved Bot Combat[/b] — smarter, faster-reacting bot teammates; bots drink potions and rescue players awaiting rescue.\n• [b]Bot follow mode[/b] with a configurable snap-back distance — includes fixes for bots teleporting away from the player or leashing away from a downed teammate.\n• [b]Bot Takeover[/b] — hand your character to a bot on demand ([b]/ai[/b]) or automatically when AFK; you resume control the moment you press anything.\n• [b]Allow Bots in Keep[/b] — fill the keep party with bots to preview loadouts (host only).\n• [b]Disable Bots[/b] ([b]/no_bots[/b]), [b]/killbots[/b], and [b]Prioritize Specials[/b] so bots focus disablers first (Deepwood Staff / Soulstealer / tagging sub-toggles).\n\n[b]Spawners, level control, and cheats[/b]\n• [b]Creature Spawner[/b] — spawn any breed where you aim: [b]/spawncreature[/b], [b]/nextcreature[/b] / [b]/prevcreature[/b], [b]/savecreature[/b], [b]/destroycreatures[/b].\n• [b]Item Spawner[/b] — [b]/spawnitem[/b], [b]/nextitem[/b] / [b]/previtem[/b].\n• [b]Level control[/b] — [b]/win[/b], [b]/fail[/b], [b]/restart[/b], [b]/die[/b], [b]/respawn[/b], [b]/fix_sound[/b].\n• [b]Time and pause[/b] — [b]/pause[/b], [b]/time_faster[/b], [b]/time_slower[/b].\n• [b]Buffs and stats[/b] — base crit chance, [b]/gigapower[/b], [b]/infinite_ammo[/b], [b]/stamina[/b], [b]/ultreset[/b], a fall-damage multiplier, and weave unlock.\n• [b]Visuals and audio[/b] — Max Ragdolls slider, disable fog / sun shadows / mutator explosions / ult VO, boss-sphere debug draw.\n• [b]Solo QoL[/b] — auto-restart on team wipe (works in Chaos Wastes and Weaves too), [b]/inn[/b] to return to the keep, Info readouts (assassin / packmaster / boss path progress).\n\n[b]Host-side lobby controls[/b] (absorbed from the retired Tweaker: Lobby)\n• [b]Slot Reservations[/b] — reserve lobby slots for specific Steam IDs via [b]/lobby_reserve <steam_id> <1-4>[/b]. Non-reserved joiners are auto-kicked while a reservation is pending. [b]/lobby_reservations[/b] lists current entries.\n• [b]Session Ignore List[/b] — two-tier: session-only [b]/lobby_ignore[/b] and persistent [b]/lobby_ignore_persist[/b]. Either tier auto-kicks the peer on join. [b]/lobby_ignored[/b] lists.\n• [b]Kick on Idle[/b] — polls every 30s for non-host, non-bot player positions while in the keep; if a player hasn't moved more than 0.05m for the configured threshold, warning then kick. [b]/lobby_idle_whitelist[/b] exempts specific Steam IDs.\n• [b]Message of the Day[/b] — when a peer joins the party, send the configured text via chat and/or popup. Chunked VMF RPC delivery respects the 500-char Stingray cap. Joiners without general_tweaker installed won't see the MOTD (no vanilla path to push system messages to a remote chat HUD).\n• [b]Modded-realm failed-join mod-list reveal[/b] — host pre-publishes a per-mod manifest to Steam lobby_data; client reads it back at hash-mismatch popup time and surfaces which client-required mods the joiner is missing, with an [b]Open Workshop[/b] button.\n\n[b]Chat commands[/b]\n• [b]/unstuck[/b] (alias [b]/catchup[/b]) — teleport to the nearest living teammate. Saves a wipe when the geometry eats you.\n• [b]/god[/b] / [b]/noclip[/b] / [b]/no_enemies[/b] / [b]/clear_enemies[/b] — toggle the corresponding features without opening the VMF menu.\n• [b]/dump_glossary[/b] / [b]/dump_cosmetics[/b] / [b]/dump_items_by_slot[/b] — write game-data tables (heroes, careers, weapons, hats, skins, frames, item slot types) to the console log. Useful for modders building catalogs or anyone who wants to look up keys.\n• See in-VMF settings for the full [b]/lobby_*[/b] command list (slot reservations, session ignore, kick-on-idle whitelist, MOTD preview, manifest dump/probe).\n\n[b]Compatibility[/b]\n• Requires [b]VMF (Vermintide Mod Framework)[/b].\n• Works in every game mode — Adventure, Chaos Wastes, Versus, Weaves, Deus.\n• Noclip, godmode, and /unstuck are local-only. The bot suite, spawners, level control, [i]Allow Duplicate Careers[/i], and the lobby_* tools act on lobby/host state.\n• [b]Moved to the [i]Tweaker: GUI[/i] mod:[/b] third-person camera / free camera, floating damage numbers, skip cutscenes and loading-screen monologues, and the in-mission inventory / keep-menus feature — subscribe to [i]Tweaker: GUI[/i] for those.\n• [b]Disabling the mod mid-session does not fully unwind active mutations[/b] — script_data flags, RagdollSettings, BuffTemplates, movement speed, etc. persist until the next game restart. Restart the game for a clean vanilla state.\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\Fatshark\Vermintide 2\console_logs\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\Fatshark\Vermintide 2\crash_dumps\ (same date/time/guid filename)\n5. Mention the mod version (find it via /<mod>_regression_test or in the console log: search for the `enabled v` line)\n\n[b]Source code:[/b] [url=https://github.com/Ensrick/vermintide-2-tweaker/tree/master/general_tweaker]github.com/Ensrick/vermintide-2-tweaker[/url]\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
