title = "Tweaker: General v0.2.171-dev";
description = "Quality-of-life and host-side utility tweaks for Vermintide 2 — third-person camera, noclip, keep menus during missions, godmode, friendly-fire off, duplicate careers, host-side lobby controls (slot reservations, session ignore, kick-on-idle, MOTD, modded-realm failed-join mod-list reveal — absorbed from the retired Tweaker: Lobby), plus a set of dev/inspection commands. Part of the Tweaker mod series. Requires VMF.\n\n[b]Third-Person Camera[/b]\n• Toggle a follow-cam at any time (chat command [b]/tp[/b] or the VMF settings checkbox).\n• Live sliders for distance, height, and side offset.\n• Optional: keep the configured distance/height during ADS / throwing zoom-in instead of pulling the camera in close.\n• [b]Free Camera[/b] mode detaches the camera from your character entirely — WASD + mouse look, Q/E for up/down, wheel = speed, F8 to exit. Inspect your model, the map, or any nearby unit.\n\n[b]Noclip[/b]\n• Fly through walls. WASD moves in the look direction, Space/Ctrl for up/down, hold Left Shift for a speed boost.\n• Configurable base speed (default 15 m/s) and boost multiplier (default 3×).\n• Chat command [b]/noclip[/b]. Toggle off mid-air and you'll fall to the ground.\n\n[b]Keep Menus in Missions[/b]\n• The keep's menu hotkeys — Inventory, Hero, Map, Achievements, Spoils of War, Weave Forge, Weave Play (whatever you've rebound them to) — work during missions, not just in the keep.\n• Adds an Inventory entry to the in-game ESC menu as a fallback if you've forgotten which key you bound.\n\n[b]Gameplay toggles[/b]\n• [b]Godmode[/b] — full invincibility for the local player: no damage taken, immune to disablers (pounce, packmaster hook, chaos-spawn / corruptor / tentacle grabs, hanging cage), AND invisible to enemy AI. Your 3P body fades as a visual cue; first-person view stays normal. Chat: [b]/god[/b].\n• [b]Allow Duplicate Careers[/b] — multiple players can pick the same hero/career in a lobby.\n• [b]Disable Friendly Fire[/b] — suppress FF damage from ranged AND melee sources. Champion+ difficulties normally enable ranged FF; this turns it off.\n• [b]Disable Enemy Spawns[/b] — block every enemy from spawning: hordes, specials, bosses, patrols, and pre-placed level enemies. Existing enemies aren't despawned; pair with godmode if you want to walk past them. Chat: [b]/no_enemies[/b].\n\n[b]Host-side lobby controls[/b] (absorbed from the retired Tweaker: Lobby)\n• [b]Slot Reservations[/b] — reserve lobby slots for specific Steam IDs via [b]/gt_lobby_reserve <steam_id> <1-4>[/b]. Non-reserved joiners are auto-kicked while a reservation is pending. [b]/gt_lobby_reservations[/b] lists current entries.\n• [b]Session Ignore List[/b] — two-tier: session-only [b]/gt_lobby_ignore[/b] and persistent [b]/gt_lobby_ignore_persist[/b]. Either tier auto-kicks the peer on join. [b]/gt_lobby_ignored[/b] lists.\n• [b]Kick on Idle[/b] — polls every 30s for non-host, non-bot player positions while in the keep; if a player hasn't moved more than 0.05m for the configured threshold, warning then kick. [b]/gt_lobby_idle_whitelist[/b] exempts specific Steam IDs.\n• [b]Message of the Day[/b] — when a peer joins the party, send the configured text via chat and/or popup. Chunked VMF RPC delivery respects the 500-char Stingray cap. Joiners without general_tweaker installed won't see the MOTD (no vanilla path to push system messages to a remote chat HUD).\n• [b]Modded-realm failed-join mod-list reveal[/b] — host pre-publishes a per-mod manifest to Steam lobby_data; client reads it back at hash-mismatch popup time and surfaces which client-required mods the joiner is missing, with an [b]Open Workshop[/b] button.\n\n[b]Chat commands[/b]\n• [b]/unstuck[/b] — teleport to the nearest living teammate. Saves a wipe when the geometry eats you.\n• [b]/win[/b] — instantly complete the current map.\n• [b]/tp[/b] / [b]/freecam[/b] / [b]/noclip[/b] / [b]/god[/b] / [b]/no_enemies[/b] — toggle the corresponding features without opening the VMF menu.\n• [b]/dump_glossary[/b] / [b]/dump_cosmetics[/b] / [b]/dump_items_by_slot[/b] — write game-data tables (heroes, careers, weapons, hats, skins, frames, item slot types) to the console log. Useful for modders building catalogs or anyone who wants to look up keys.\n• See in-VMF settings for the full [b]/gt_lobby_*[/b] command list (slot reservations, session ignore, kick-on-idle whitelist, MOTD preview, manifest dump/probe).\n\n[b]Compatibility[/b]\n• Requires [b]VMF (Vermintide Mod Framework)[/b].\n• Works in every game mode — Adventure, Chaos Wastes, Versus, Weaves, Deus.\n• Most features are local-only (camera modes, noclip, godmode, unstuck). [i]Allow Duplicate Careers[/i], the keep-menu hotkey patch, and the gt_lobby_* host-side tools affect lobby/host state.\n• [b]Disabling the mod mid-session does not fully unwind active mutations[/b] — script_data flags, RagdollSettings, BuffTemplates, movement speed, etc. persist until the next game restart. Restart the game for a clean vanilla state.\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (find it via /<mod>_regression_test or in the console log: search for the `enabled v` line)\n\n[b]Source code:[/b] [url=https://github.com/Ensrick/vermintide-2-tweaker/tree/master/general_tweaker]github.com/Ensrick/vermintide-2-tweaker[/url]\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
