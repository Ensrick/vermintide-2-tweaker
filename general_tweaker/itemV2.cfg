title = "Tweaker: General";
description = "Quality-of-life and host-side utility tweaks for Vermintide 2 — third-person camera, noclip, keep menus during missions, godmode, friendly-fire off, duplicate careers, plus a set of dev/inspection commands. Part of the Tweaker mod series. Requires VMF.\n\n[b]Third-Person Camera[/b]\n• Toggle a follow-cam at any time (chat command [b]gt tp[/b] or the VMF settings checkbox).\n• Live sliders for distance, height, and side offset.\n• Optional: keep the configured distance/height during ADS / throwing zoom-in instead of pulling the camera in close.\n• [b]Free Camera[/b] mode detaches the camera from your character entirely — WASD + mouse look, Q/E for up/down, wheel = speed, F8 to exit. Inspect your model, the map, or any nearby unit.\n\n[b]Noclip[/b]\n• Fly through walls. WASD moves in the look direction, Space/Ctrl for up/down, hold Left Shift for a speed boost.\n• Configurable base speed (default 15 m/s) and boost multiplier (default 3×).\n• Chat command [b]gt noclip[/b]. Toggle off mid-air and you'll fall to the ground.\n\n[b]Keep Menus in Missions[/b]\n• The keep's menu hotkeys — Inventory, Hero, Map, Achievements, Spoils of War, Weave Forge, Weave Play (whatever you've rebound them to) — work during missions, not just in the keep.\n• Adds an Inventory entry to the in-game ESC menu as a fallback if you've forgotten which key you bound.\n\n[b]Gameplay toggles[/b]\n• [b]Godmode[/b] — full invincibility for the local player: no damage taken, immune to disablers (pounce, packmaster hook, chaos-spawn / corruptor / tentacle grabs, hanging cage), AND invisible to enemy AI. Your 3P body fades as a visual cue; first-person view stays normal. Chat: [b]gt god[/b].\n• [b]Allow Duplicate Careers[/b] — multiple players can pick the same hero/career in a lobby.\n• [b]Disable Friendly Fire[/b] — suppress FF damage from ranged AND melee sources. Champion+ difficulties normally enable ranged FF; this turns it off.\n\n[b]Chat commands[/b]\n• [b]gt unstuck[/b] — teleport to the nearest living teammate. Saves a wipe when the geometry eats you.\n• [b]gt win[/b] — instantly complete the current map.\n• [b]gt tp[/b] / [b]gt freecam[/b] / [b]gt noclip[/b] / [b]gt god[/b] — toggle the corresponding features without opening the VMF menu.\n• [b]gt dump_glossary[/b] / [b]gt dump_cosmetics[/b] / [b]gt dump_items_by_slot[/b] — write game-data tables (heroes, careers, weapons, hats, skins, frames, item slot types) to the console log. Useful for modders building catalogs or anyone who wants to look up keys.\n\n[b]Compatibility[/b]\n• Requires [b]VMF (Vermintide Mod Framework)[/b].\n• Works in every game mode — Adventure, Chaos Wastes, Versus, Weaves, Deus.\n• Most features are local-only (camera modes, noclip, godmode, unstuck). [i]Allow Duplicate Careers[/i] and the keep-menu hotkey patch affect lobby/host state.\n\n[hr][/hr]\n[i]Active development — bug reports and feature requests welcome on the issue tracker.[/i]\n\n[b]Source code:[/b] [url=https://github.com/Ensrick/vermintide-2-tweaker/tree/master/general_tweaker]github.com/Ensrick/vermintide-2-tweaker[/url]\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
