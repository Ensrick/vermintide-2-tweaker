title = "Tweaker: Chaos Wastes v0.7.345-dev";
description = "[b]Tweaker: Chaos Wastes v0.7.345-dev[/b]\n\nHost-controlled customization for Chaos Wastes runs — including (new in 0.7.0) any Adventure mission played inside one.\n\n[b]Adventure Maps in Chaos Wastes[/b] [i](experimental)[/i]\n• Toggle any campaign mission into the random map pool — grouped by DLC (Helmgart, Back to Ubersreik, Shadows Over Bögenhafen, Karak Azgaraz, A Treacherous Adventure, Verminious Dreams, Reikland Tales, The Curse of Drachenfels, Winds of Magic) plus Event Missions (Fortunes of War, A Quiet Drink, Feast of Grimnir).\n• Tomes and grimoires become Chests of Trials.\n• Each adventure map seeds 5 altars (upgrade, melee swap, ranged swap, 2× boon).\n• CW pickups replace campaign pickups: Pilgrim's Coin, deus potions, healing, ammo, grenades.\n• Loot dice and other adventure collectibles convert to Pilgrim's Coin.\n• Cursed nodes apply the matching sky/lighting tint to adventure maps.\n• Altars and Chests of Trials are non-blocking — walk straight through them.\n• [i]Replace Shrines with Missions[/i]: convert SHOP nodes to TRAVEL nodes.\n• Exact cursed-mission count slider.\n\n[b]Run structure[/b]\n• Boon-altar counts per shrine and per Chest of Trials.\n• Altar mix sliders: upgrade, melee swap, ranged swap, boon.\n• Force Bel'akor's Temple.\n• Finale-god override.\n• Arena ammo count.\n• Cursed-chest count.\n• Disabling a curse re-rolls within the same god — the node stays cursed, just by a different curse.\n• Optional: revive dead teammates on Chest of Trials completion.\n\n[b]Boons (174 in the pool)[/b]\n• Disable any boon (never appears in offerings).\n• Grant any boon as a starting boon — host-applied to every player.\n\n[b]Curses (14 in the pool)[/b]\n• Disable any curse.\n• Modified curse effects sync to all clients.\n\n[b]Weapon traits (20 CW traits)[/b]\n• Ban any trait from the CW pool.\n• Unlock any trait on any weapon.\n\n[b]Tweaks[/b]\n• Softer Khaine's Fury (configurable damage cap).\n• Campaign damage / speed / cooldown-reduction potions in the CW potion pool.\n• Bomb-boon balance toggles: uniform cooldown, mutually-exclusive bomb boons, Endless Bombs consumes Morgrim's, block Ranger Veteran's save-grenade chance for Morgrim's.\n• Coin multiplier and starting-coin override.\n\n[b]Multiplayer[/b]\n• [b]All players in the lobby must have this mod installed.[/b]\n• The host's settings apply to every player in the run.\n• Modified boon effects propagate to all clients.\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (find it via /<mod>_regression_test or in the console log: search for the `enabled v` line)\n\nRequires [b]VMF (Vermintide Mod Framework)[/b].\n\n[b]Source code:[/b] [url=https://github.com/Ensrick/vermintide-2-tweaker/tree/master/chaos_wastes_tweaker]github.com/Ensrick/vermintide-2-tweaker[/url]\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
