description = "[b]Tweaker: Enemies[/b]\n\nComprehensive enemy spawn and composition controls. Customize horde presets, special spawning by difficulty, breed substitution, faction swaps, difficulty mimic, and horde-size multipliers. Requires VMF.\n\n[b]Features[/b]\n- Horde composition presets\n- Difficulty subsystem overrides\n- Per-difficulty special-spawn and enemy-health controls\n- Breed substitution and faction swaps\n- Horde-size and active-enemy limits\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\\n4. If the game crashed, also attach the matching crash dump\n5. Mention the mod version shown in the console log\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
