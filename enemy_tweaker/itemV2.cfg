title = "Tweaker: Enemies v0.7.25-dev";
description = "[b]Tweaker: Enemies v0.5.17-dev[/b]\n\nComprehensive enemy spawn and composition controls. Customize horde presets, special spawning per difficulty, breed substitution, faction swaps, difficulty mimic, and horde size multipliers. Integrated Big Rebalance support: stagger/damage math rewrites, THP-on-kill mechanics, and per-breed tuning. Requires VMF.\n\n[b]Features[/b]\n- Horde Presets: All Elites, mixed-faction compositions, theme-based variants\n- Difficulty Mimic: override difficulty subsystems independently (Champion stats + Cataclysm hordes, Legend stats + Recruit specials)\n- Special Spawns: per-difficulty max active, max same type, spawn weights, per-special enable/disable\n- Breed Substitution: replace any breed with another (faction-wide or specific picks)\n- Faction Swaps: replace all Skaven/Chaos/Beastmen with alternate faction hordes\n- Big Rebalance: stagger formula rewrite, damage calculation overhaul, shield-slam rework, THP-on-kill templates\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (find it via /<mod>_regression_test or in the console log: search for the `enabled v` line)\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
