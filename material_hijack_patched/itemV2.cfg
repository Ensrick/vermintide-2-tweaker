title = "Material-Hijack (patched)";
description = "Defensively-patched fork of Grundlid's Material-Hijack. Same behaviour (custom materials + animated textures + particle effects on modded cosmetic units) plus pre-validation on every spawn / package load to prevent the `[Script Error]: Unit not found #ID[...]` C-level fatal when a bot's loadout references an unloadable unit. CAVEAT: this fork is only useful if you do NOT run Loremaster's Armoury or any other mod that depends on the original Material-Hijack's mod_id at runtime. Those downstream mods call `get_mod('Material-Hijack')` to find the API, and this fork's mod_id is different (`material_hijack_patched`), so disabling the original to use this fork would break them. If both forks are enabled at the same time on the same machine, every hook runs twice per equip/visibility/spawn event — which on NVIDIA hardware causes a renderer-thread deadlock in `CreateGraphicsPipelineState`. To prevent that, this fork automatically skips hook registration when it detects the original is also enabled; in that mode it does nothing useful and you should disable it. Sourced from the decompiled original — same author credit; uploads as a separate Workshop item to keep the original intact.";
