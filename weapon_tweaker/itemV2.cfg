title = "Tweaker: Weapons v0.12.205-dev";
description = "[b]Tweaker: Weapons v0.12.89-dev[/b]\n\nCross-career weapon unlocks, animation remapping, and per-career scale/grip tweaks. Enables every character to wield weapons native to other careers with proper 3P animation redirection and stance handling. Requires VMF.\n\n[b]Features[/b]\n- 50+ cross-career weapon unlocks (Kruber wields Saltzpyre billhook, Kerillian uses spears, Bardin gets rapiers, etc.)\n- Automatic 3P animation remapping (no T-pose stances, correct stance per career/weapon pair)\n- Per-career weapon scale and grip-position tweaks for visual fit\n- Big Rebalance integration (opt-in ~113 toggles for damage/profiles/buffs/talents via sister mod `bt`)\n- Moonfire Bow AOE revert (optional cosmetic puff or gameplay AOE)\n- Kruber Longbow zoom disable/manual controls\n- Inventory wield-stance preview shows correct cross-career poses\n- Comprehensive polearm preview fixes (halberd/Tuskgor/billhook/elf spear on all careers)\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (find it via /<mod>_regression_test or in the console log: search for the `enabled v` line)\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
