title = "Crafting in Modded v0.8.129-dev";
description = "[b]Crafting in Modded v0.8.129-dev[/b] (dev / friends-only test build)\n\nModded crafting menus for Vermintide 2 — craft any career-eligible weapon with full control over its properties, traits, illusion, rarity, and power level. Uses the Athanor (Winds of Magic) forge UI plus a modded-realm standard Keep forge. Split from Weapon Tweaker. Requires VMF.\n\n[b]How it works[/b]\n• Press [b]B[/b] in the Keep (or Chaos Wastes hub) to open the Athanor, repurposed as a modded crafting menu. Hotkey is reconfigurable in the mod's VMF settings. Inside missions, both crafting surfaces follow Tweaker: GUI's experimental \"Allow crafting bench in mission\" option.\n• Pick any career-eligible weapon from your character's full weapon pool, then dial in:\n   – Power level (1–300)\n   – Properties (Attack Speed, Crit Chance, Power vs. X, etc.)\n   – Traits — pick from the full eligible list for the weapon\n   – Illusion (cosmetic skin) — any illusion the Customization window would show\n• Newly crafted weapons are automatically equipped in the Primary or Secondary slot chosen for crafting by default. Disable \"Automatically equip newly crafted weapons\" to keep the prior inventory-only behavior. Accessories are unaffected.\n• The standard Keep forge (salvage, craft, reroll, upgrade, apply skin, convert dust) works locally without sending data to PlayFab. Open it with its hotkey or /cim_craft_standard.\n\n[b]Modded rarity[/b]\n• Crafted weapons get a custom [b]Modded[/b] rarity (soft pale gold) that grants all four customization tabs — Properties, Traits, Illusion, and Upgrade — bypassing the vanilla rarity gates that hide tabs on default/promo items.\n• A scoped fix lets custom rarities coexist with Chaos Wastes — Deus chests no longer crash when the player carries a modded weapon into a run.\n\n[b]Persistence[/b]\n• Crafts persist across game sessions. Close the game, come back tomorrow, your crafted items are still in inventory with full state (properties, traits, illusion, power level).\n• Illusion choices applied to modded items via the Customization window are saved with the item.\n• To permanently remove all unequipped CIM-crafted weapons and accessories, run [b]/forge_delete_all[/b], review its exact preview count, then run [b]/forge_delete_all CONFIRM[/b]. Ordinary inventory is retained.\n\n[b]Modded-realm illusion swap[/b]\n• In modded realm, every weapon illusion you own the DLC for is automatically unlocked in the Customization grid — apply any owned illusion to any compatible weapon. DLC paywalls are respected (unowned DLC illusions stay locked).\n• If [b]Tweaker: Cosmetics[/b] is also installed, the two mods coordinate: cim owns the illusion-swap pipeline; Tweaker: Cosmetics yields and keeps its other features (custom illusions, LA bridge, offhand picker, hat unlocks).\n\n[b]Compatibility[/b]\n• Requires VMF.\n• Works alongside MoreItemsLibrary, character_weapon_variants, cosmetics_tweaker, and the other Tweaker mods.\n• Modded realm only — does not modify the live PlayFab backend.\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (printed at the top of the in-game chat when you load into the keep)\n\n[b]Source code:[/b] [url=https://github.com/Ensrick/vermintide-2-tweaker/tree/master/crafting_in_modded_dev]github.com/Ensrick/vermintide-2-tweaker[/url]\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
