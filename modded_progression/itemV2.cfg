title = "Modded Progression (WIP)";
description = "Re-enables 100% of vanilla Vermintide 2's progression systems while running in the modded realm. Earn XP, level careers, accumulate shillings and crafting materials, open loot chests, claim Okri's Challenges, buy from Lohner's Emporium, craft and salvage at the keep bench — every vanilla system, every reward path, working in modded.\n\n[b]How it works[/b]\n• All state persists locally via the mod's settings file. Your real PlayFab account is never written to.\n• Vanilla progression UIs (level-end rewards popup, Okri's Challenges claim, Lohner's purchase, keep crafting bench) get un-gated and routed through a local mirror overlay.\n• Three starting-state options: brand-new player at level 1, level 35 with default inventory, or level 35 with every cosmetic unlocked.\n\n[b]Compatibility[/b]\n• Requires VMF.\n• Optional siblings: character_weapon_variants and cosmetics_tweaker — when both are installed, their items gate behind Modded Progression's unlocks instead of being free.\n• Does not interact with Chaos Wastes — CW already routes through the vanilla pipeline this mod un-gates.\n\n[hr][/hr]\n[i]Active development — see CHANGELOG and PLAN.md in the repo for status.[/i]\n\n[b]Source code:[/b] [url=https://github.com/Ensrick/vermintide-2-tweaker/tree/master/modded_progression]github.com/Ensrick/vermintide-2-tweaker[/url]\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
