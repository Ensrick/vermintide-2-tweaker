title = "Modded Progression v0.2.36-dev";
description = "Re-enables vanilla Vermintide 2 progression systems while running in the modded realm. Earn XP, level careers, accumulate shillings and crafting materials, open loot chests, claim Okri's Challenges, buy from Lohner's Emporium, craft and salvage at the keep bench.\n\n[b]How it works[/b]\n• All state persists locally via the mod's settings file. Your real PlayFab account is never written to.\n• Progression UIs are enabled only where their write path has a safe local replacement. Daily login reward claiming remains disabled until its mixed item/currency grant is fully local.\n• Three starting-state options: brand-new player at level 1, level 35 with default inventory, or level 35 with every cosmetic unlocked.\n\n[b]Compatibility[/b]\n• Requires VMF.\n• Optional siblings: character_weapon_variants and cosmetics_tweaker — when both are installed, their items gate behind Modded Progression's unlocks instead of being free.\n• Does not interact with Chaos Wastes — CW already routes through the vanilla pipeline this mod un-gates.\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (find it via /<mod>_regression_test or in the console log: search for the `enabled v` line)\n\n[b]Source code:[/b] [url=https://github.com/Ensrick/vermintide-2-tweaker/tree/master/modded_progression]github.com/Ensrick/vermintide-2-tweaker[/url]\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
