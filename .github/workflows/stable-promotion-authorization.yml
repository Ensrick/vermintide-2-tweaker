name: Stable Promotion Authorization

# Security boundary for issue #676. pull_request_target loads this workflow from
# the protected base branch. It deliberately checks out only that base revision
# and never executes files from the incoming PR.
on:
  pull_request_target:
    branches: [master, main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: stable-promotion-authorization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  stable-promotion-authorization:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base revision only
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
          # check_promotion_authorization.ps1 reads PR-side mod sources through
          # the GitHub contents API (qa/check_promotion_authorization.ps1:310),
          # never the working tree, so this job only needs qa/ and tools/.
          # blob:none skips the bundle blobs that burned 191s of the 300s
          # timeout budget (issue #540).
          filter: 'blob:none'
          sparse-checkout: |
            qa
            tools

      - name: Validate live promotion grant
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./qa/check_promotion_authorization.ps1
