name: PR auto-close authorization

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: pr-autoclose-authorization-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-autoclose-authorization:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted default-branch policy
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Validate PR issue-closure references
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./qa/check_pr_autoclose.ps1
