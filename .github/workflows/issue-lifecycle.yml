name: Issue lifecycle guard

on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
  schedule:
    # GitHub exposes comment-pin state through GraphQL, but comment pin/unpin is
    # not an issue_comment workflow activity. The daily read catches pin-only
    # drift that has no opened/labeled/comment-created event.
    - cron: '17 11 * * *'

permissions:
  contents: read
  issues: read

concurrency:
  group: issue-lifecycle-${{ github.repository }}
  cancel-in-progress: true

jobs:
  tracker-guard:
    if: ${{ github.event_name != 'issue_comment' || !github.event.issue.pull_request }}
    runs-on: ubuntu-latest
    # The blocking label/card grammar is fast. The staged report-only source
    # audit may hydrate and tokenize historical Lua blobs from every deployed
    # record; give that immutable audit a bounded but realistic window.
    timeout-minutes: 20
    steps:
      - name: Checkout default-branch policy
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          # The live-card contract reads the exact deployed source commits
          # named by the release manifest. Full history preserves that
          # authority; the blob filter still excludes multi-gigabyte bundles.
          fetch-depth: 0
          # Source authority hydrates only the immutable Lua blobs named by
          # deployed commits; blob:none keeps unrelated ~7 GiB bundles out of
          # the checkout while git archive fetches those exact objects (#540).
          # The sparse patterns below also land current active Lua in the
          # initial pack, and most deployed blobs are shared with it, so the
          # authority's batched prefetch has little left to hydrate (#750).
          filter: 'blob:none'
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /qa/
            /tools/
            /*/scripts/mods/

      - name: Validate tracker lifecycle and pinned test cards
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./tools/github/check-lifecycle-cardinality.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/github/check-lifecycle-cardinality.ps1 -Repository '${{ github.repository }}'
