name: QA

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  # Read-only issue/PR metadata supports lifecycle cardinality and trusted
  # promotion authorization. Never grant write here (issue #750 is about
  # unlogged label edits; CI must stay read-only).
  issues: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# CI is the SAME gate as local: it runs qa/run_all.ps1 (the full Standard /
# Blocking / Advisory policy engine documented in qa/CHECKS.md), not a
# hand-picked subset with continue-on-error. The policy engine — not the
# workflow — decides what blocks. luacheck and check_stale_docs are Advisory;
# check_file_sizes and check_name_integrity block only on regressions past their
# frozen baselines in qa/baselines/. lint-mod runs as its own blocking step
# (duplicate-hook gate, CLAUDE.md NON-NEG #8), which run_all does not include,
# as does the tracker lifecycle-cardinality guard (issue #750).
# Windows + pwsh because the whole suite is PowerShell-native (backslash path
# matching, the committed tools/luacheck/luacheck.exe, backslash-relative
# signatures). Issue #429.
jobs:
  qa-gate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so check_dev_only_edits can diff a PR against its base
          # (origin/$GITHUB_BASE_REF). Best-effort — the check degrades to a
          # no-op, never a false block, if the base ref is unavailable.
          fetch-depth: 0
          # Partial clone: full commit history but blobs fetched only for the
          # checked-out tree. Without this the clone downloads every historical
          # *.mod_bundle blob; PR #1126's runs died INSIDE checkout at the
          # 20-minute job timeout (2x, conclusion=cancelled at 20m05s/20m10s).
          # Name-only diffs (check_dev_only_edits) need no historical blobs;
          # any check that reads one triggers an on-demand fetch and still works.
          filter: 'blob:none'
          persist-credentials: false

      - name: Authorize stable promotion (maintainer-only)
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./qa/check_promotion_authorization.ps1 -WriteGitHubEnv

      - name: Validate authorized stable promotion
        if: env.VT2_PROMOTION == '1'
        shell: pwsh
        run: |
          $changed = @(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          if ($LASTEXITCODE -ne 0 -or $changed.Count -eq 0) {
            Write-Error "Unable to resolve the exact PR change set for stable validation."
            exit 2
          }
          foreach ($dir in ($env:VT2_PROMOTION_DIRS -split ';')) {
            if (-not $dir) { continue }
            ./qa/check_promotion.ps1 -Mod $dir -ChangedPath $changed
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Windows PowerShell 5.1 - promotion self-test
        shell: powershell
        run: ./qa/check_promotion.ps1 -SelfTest

      - name: Windows PowerShell 5.1 - release pipeline self-test
        shell: powershell
        run: ./tools/ship/ship.ps1 -SelfTest

      - name: Windows PowerShell 5.1 - QA compatibility matrix
        shell: powershell
        run: ./qa/check_ps51_compatibility.ps1 -SelfTest

      - name: Validate PR issue-closure references
        if: github.event_name == 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./qa/check_pr_autoclose.ps1

      - name: run_all.ps1 (full QA gate — the policy engine decides)
        shell: pwsh
        env:
          # Read-only metadata lets run_all validate an explicitly authorized
          # closure receipt; ordinary PRs use Refs and make no API call.
          GH_TOKEN: ${{ github.token }}
        run: ./qa/run_all.ps1
        # Exits non-zero only when a Standard-policy check hits exit >=2 or a
        # Blocking-policy check hits any non-zero. Advisory checks (luacheck,
        # stale-docs, loc-tags, issue-label sync, in-progress) never fail this
        # step. The gh-querying advisory checks self-exit 0 when unauthenticated,
        # and are Advisory regardless, so no GH token is required.

      - name: lint-mod.ps1 (duplicate-hook gate, all mods)
        shell: pwsh
        run: |
          ./tools/mod-lint/lint-mod.ps1
          $code = $LASTEXITCODE
          # Exit 2 = duplicate VMF hook registration (VMF silently drops the 2nd;
          # the single most-emphasized rule in the repo, CLAUDE.md NON-NEG #8) ->
          # BLOCK. Exit 1 = heuristic warnings (forward-ref / late-local /
          # save-restore / network-bound) -> report, don't block. Mirrors the
          # local pre-commit hook's severity ladder exactly.
          if ($code -ge 2) { Write-Host "::error::lint-mod found duplicate-hook error(s) (exit $code)"; exit 1 }
          if ($code -eq 1) { Write-Host "lint-mod reported non-blocking warnings (exit 1)." }
          exit 0

      - name: check-lifecycle-cardinality.ps1 (tracker lifecycle guard, issue 750)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        # BLOCKING by deliberate design (issue #750): an out-of-repo strip sweep
        # left 10 open issues with zero lifecycle labels, and the advisory
        # check_issue_status_labels.ps1 warning did not stop it. This step FAILS
        # on cardinality drift, retired open labels, blocked/coop leakage, or an
        # invalid/unpinned newest CURRENT LIVE TEST card on a ready issue, or
        # multiple pinned exact cards. Read-only: pages issue labels and fetches
        # full comments only for ready issues via GraphQL isPinned; never edits
        # labels or comments. No skip label - a red run is fixed by
        # repairing the tracker (ship.ps1 Get-LifecycleEditPlan), not the gate.
        run: |
          ./tools/github/check-lifecycle-cardinality.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tools/github/check-lifecycle-cardinality.ps1
