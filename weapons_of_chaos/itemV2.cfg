title = "Weapons of Chaos v0.1.30-dev";
description = "[b]Weapons of Chaos v0.1.30-dev[/b]\n\nWield the weapons of your enemies. Weapons of Chaos adds playable enemy weapons and named keep-trophy artifacts to all five heroes — each one a real inventory item cloned from a base weapon template with its model swapped to an enemy/trophy mesh (the same approach as Character Weapon Variants).\n\n[i]Work in progress — early test build.[/i]\n\n[b]Features[/b]\n- Blightreaper: the actual Bögenhafen mission artifact model, wieldable by every career, with a four-light 75%-speed sword action graph, +15% intrinsic critical chance, armour-capable attacks, greataxe impacts, Executioner Sword swing audio dependency, Hagbane poison, kill-spawned Shyish spirits that convert green health to temporary health, fixed 600 power (900 in Chaos Wastes), unique Cursed rarity, and an inspect whisper\n- More enemy weapons and named artifacts planned\n\nRequires Vermintide Mod Framework and More Items Library.\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (in the console log, search for the `Weapons of Chaos v` line)\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
