title = "Tweaker: Events v0.4.13-dev";
description = "[b]Tweaker: Events v0.4.13-dev[/b]\n\nHost-side mutator picker for Vermintide 2. Activate any vanilla mutator (difficulty modifiers, special spawns, hordes, winds of magic) for the lobby — including dormant live-event mutators like Geheimnisnacht and Khorne's Skulls — without waiting for Fatshark to push the event live. Vanilla clients work; only the host needs the mod.\n\n[b]Features[/b]\n- Event presets dropdown: Geheimnisnacht 2021/2025, Khorne's Skulls 2023 with auto keep-decoration swap and mutator injection\n- 50+ individual mutators across 7 categories: Difficulty, Special/Elite Spawns, Hordes, Atmosphere, Objectives, Winds of Magic, raw Live-Event Mutators\n- DLC paywall respect: presets/mutators owned by uninstalled DLC are hidden\n- Mid-game preset apply: auto-reloads the keep/mission when preset changes\n- Per-mutator and per-preset localization with canonical mutator name display\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (find it via /<mod>_regression_test or in the console log: search for the `enabled v` line)\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
