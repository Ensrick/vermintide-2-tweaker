title = "Tweaker: GUI v0.2.275";
description = "Quality-of-life improvements for Vermintide 2's menus and HUD.\n[list]\n[*][b]Mod Tweaker[/b] - edit Tweaker-series settings in a native-style in-game menu with search, profiles, collapsible groups, bulk Apply/Default, and advanced widget support.\n[*][b]HUD tools[/b] - reposition HUD elements, hide or cycle HUD modes, use optional overlays, and integrate UI Tweaks behavior.\n[*][b]In-mission menus[/b] - optional inventory, hero selection, and mission-map access with crash-safe resource handling.\n[*][b]Modded loadouts[/b] - isolated native loadout rows for the modded realm, including supported modded items and cosmetics.\n[*][b]Camera and menu QoL[/b] - third-person and free cameras, cutscene controls, startup options, and inventory presentation choices.\n[/list]\nPart of the Tweaker mod series. Requires VMF.\n\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version printed in chat when the mod loads\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
