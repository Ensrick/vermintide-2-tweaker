title = "Tweaker: Careers v0.3.53-dev";
description = "[b]Tweaker: Careers v0.3.18-dev[/b]\n\nCareer talent reworks and balance adjustments across all 15 base and 5 DLC careers. ~35 custom talent toggles covering damage, cooldown, stagger, movement, and ability mechanics. Integrated Big Rebalance support: 160+ optional rebalances pre-registered for seamless cross-mod sync. Requires VMF.\n\n[b]Features[/b]\n- Talent Reworks: Exuberance stacking DR, Blade Barrier stacks on block, Virtue of the Ideal per-kill, Fervent Huntress passive movement, Mainstay universal stagger, prayer auras, ult cooldown caps\n- Big Rebalance Integration: opt-in BR toggles for career abilities, talent payloads, passive buffs across all characters (default off, master toggle gates registration)\n- Mutex Cluster Framework: mutually-exclusive rework choices (pick one of N alternatives with auto-enforce)\n- Per-career talent overrides with description text updates shown in-game\n- Sibling API: unlocks shared with Modded Progression and cosmetics_tweaker\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\ (filename pattern: console-YYYY-MM-DD-HH.MM.SS-<guid>.log)\n4. If the game crashed, ALSO attach the matching crash dump from %appdata%\\Fatshark\\Vermintide 2\\crash_dumps\\ (same date/time/guid filename)\n5. Mention the mod version (find it via /<mod>_regression_test or in the console log: search for the `enabled v` line)\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
