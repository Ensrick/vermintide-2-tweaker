title = "Tweaker: Careers v0.4.1-beta";
description = "[b]Tweaker: Careers[/b]\n\nCareer talent reworks and balance adjustments across the base and DLC careers. Provides custom talent, cooldown, stagger, movement, passive, and ability controls. Requires VMF.\n\n[b]Beta note[/b]\nCareer talent/ability casting and transposition is disabled in this beta while it is redesigned. Existing saved selections are retained but are not exposed or applied.\n\n[b]Features[/b]\n- Opt-in talent and passive reworks\n- Career ability and cooldown controls\n- Mutually exclusive rework choices\n- Per-career talent overrides with updated descriptions\n- Shared unlock integration with sibling Tweaker mods\n\n[hr][/hr]\n[b]Reporting bugs or crashes[/b]\n1. Open an issue at https://github.com/Ensrick/vermintide-2-tweaker/issues\n2. Describe what you were doing, what you expected, and what happened instead\n3. Attach the latest game log from %appdata%\\Fatshark\\Vermintide 2\\console_logs\\\n4. If the game crashed, also attach the matching crash dump\n5. Mention the mod version shown in the console log\n\n[hr][/hr]\n[url=https://www.buymeacoffee.com/ensrick][img]https://gist.githubusercontent.com/Ensrick/10e08f35dd9097e73d68f1c628a11ce3/raw/buy-me-coffee-icon.svg[/img] [b]Like my mods?[/b] Buy me a coffee.[/url]";
